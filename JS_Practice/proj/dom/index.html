<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
</head>
<body>
    <div class="container" style="background-color:#212121; text-align: center; margin-top: 50px; color: white;">
        <h1>Welcome to DOM Manipulation</h1>
        <p>This is a simple example of manipulating the DOM using JavaScript.</p>
        <!-- <button id="changeColorBtn">Change Background Color</button> -->
    </div>

</body>
    <script>
        const div=document.createElement('div');
        div.className='container';
        div.style.backgroundColor="green";
        div.id='dynamicContainer';
        div.style.padding='20px';
        div.style.marginTop='20px';
        const text=document.createTextNode("adding div usin js")
        div.appendChild(text)
        document.body.appendChild(div)
    </script>
</html>
