<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: background 0.3s, color 0.3s;
        }


        body.dark {
            background: #121212;
            color: #f5f5f5;
        }

        .container {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            transition: background 0.3s, box-shadow 0.3s;
        }

        body.dark .container {
            background: #1e1e1e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
        }


        body.dark h1 {
            color: #f5f5f5;
        }


        #themeToggle {
            display: block;
            margin: 0 auto 20px;
            padding: 8px 16px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #themeToggle:hover {
            background: #5568d3;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #todoInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, background 0.3s, color 0.3s;
        }

        #todoInput:focus {
            outline: none;
            border-color: #667eea;
        }


        body.dark #todoInput {
            background: #222;
            color: #fff;
            border-color: #444;
        }


        #addBtn {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #addBtn:hover {
            background: #5568d3;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            flex: 1;
            padding: 8px;
            background: #f5f5f5;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }


        body.dark .filter-btn {
            background: #333;
            color: #fff;
        }

        body.dark .filter-btn.active {
            background: #667eea;
        }


        #todoList {
            list-style: none;
        }


        .todo-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background 0.3s;
        }

        .todo-item:hover {
            background: #f0f0f0;
        }

        body.dark .todo-item {
            background: #2a2a2a;
        }


        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item span {
            flex: 1;
            font-size: 16px;
            color: #333;
        }


        body.dark .todo-item span {
            color: #f5f5f5;
        }

        .todo-item.completed span {
            text-decoration: line-through;
            color: #999;
        }

        body.dark .todo-item.completed span {
            color: #aaa;
        }


        .todo-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            cursor: pointer;
        }

        .delete-btn {
            padding: 6px 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .edit-btn {
            padding: 6px 12px;
            margin-right: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .delete-btn:hover {
            background: #ee5a52;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        body.dark .empty-state {
            color: #aaa;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📃 My Todo List</h1>
        <button id="themeToggle">🌙 Dark Mode</button>

        <div class="input-container">
            <input type="text" id="todoInput" placeholder="Add a new task...">
            <button id="addBtn">Add</button>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todoList"></ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
